<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0066cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dashboard Ejecutivo - Nadaki Excursions</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6fb;color:#1a1a2e;line-height:1.6}
    /* NAVBAR */
    .navbar{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .nav-container{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;height:64px}
    .nav-brand{display:flex;align-items:center;gap:12px}
    .nav-brand h1{font-size:20px;font-weight:700;color:#0066cc}
    .nav-brand span{font-size:13px;color:#6b7280;font-weight:400}
    .nav-actions{display:flex;gap:10px;align-items:center}
    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;text-decoration:none}
    .btn-primary{background:#0066cc;color:#fff}.btn-primary:hover{background:#0052a3}
    .btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.btn-secondary:hover{background:#e9ecef}
    .btn-sm{padding:6px 12px;font-size:12px}
    /* PAGE */
    .page{max-width:1440px;margin:0 auto;padding:24px}
    /* FILTERS */
    .filters-bar{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid #e5e7eb;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
    .filter-group{display:flex;flex-direction:column;gap:4px;min-width:0}
    .filter-group label{font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
    .filter-group select,.filter-group input{padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;background:#fff;color:#1a1a2e;min-width:140px}
    .filter-group select:focus,.filter-group input:focus{outline:none;border-color:#0066cc}
    .filter-actions{display:flex;gap:8px;align-items:flex-end;margin-left:auto}
    /* QUICK DATE PILLS */
    .date-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
    .pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid #e5e7eb;background:#f9fafb;color:#374151;cursor:pointer;transition:all .15s}
    .pill.active,.pill:hover{background:#0066cc;color:#fff;border-color:#0066cc}
    /* KPI GRID */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
    .kpi-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid #e5e7eb;position:relative;overflow:hidden}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
    .kpi-card.blue::before{background:#0066cc}
    .kpi-card.green::before{background:#059669}
    .kpi-card.orange::before{background:#d97706}
    .kpi-card.red::before{background:#dc2626}
    .kpi-card.purple::before{background:#7c3aed}
    .kpi-card.teal::before{background:#0891b2}
    .kpi-label{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .kpi-value{font-size:24px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
    .kpi-card.blue .kpi-value{color:#0066cc}
    .kpi-card.green .kpi-value{color:#059669}
    .kpi-card.orange .kpi-value{color:#d97706}
    .kpi-card.red .kpi-value{color:#dc2626}
    .kpi-card.purple .kpi-value{color:#7c3aed}
    .kpi-card.teal .kpi-value{color:#0891b2}
    .kpi-sub{font-size:12px;color:#9ca3af}
    .kpi-change{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin-top:4px;padding:2px 6px;border-radius:4px}
    .kpi-change.up{background:#d1fae5;color:#059669}
    .kpi-change.down{background:#fee2e2;color:#dc2626}
    .kpi-change.neutral{background:#f3f4f6;color:#6b7280}
    /* GRID LAYOUTS */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
    .grid-6040{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:900px){.grid-2,.grid-3,.grid-6040{grid-template-columns:1fr}}
    /* SECTION CARDS */
    .section-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;margin-bottom:20px}
    .section-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f3f4f6}
    .section-title{font-size:16px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px}
    .section-meta{font-size:12px;color:#9ca3af}
    /* TABLES */
    table{width:100%;border-collapse:collapse}
    thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;background:#f9fafb;border-bottom:1px solid #e5e7eb;white-space:nowrap;cursor:pointer;user-select:none}
    thead th:hover{background:#f3f4f6}
    thead th.sort-asc::after{content:' ↑'}
    thead th.sort-desc::after{content:' ↓'}
    tbody tr{border-bottom:1px solid #f3f4f6;transition:background .15s}
    tbody tr:hover{background:#f9fafb}
    tbody tr:last-child{border-bottom:none}
    td{padding:11px 16px;font-size:13px;color:#374151;vertical-align:middle}
    .td-bold{font-weight:600;color:#1a1a2e}
    .td-mono{font-family:'SF Mono',Menlo,monospace;font-size:13px}
    .td-right{text-align:right}
    .empty-state{text-align:center;padding:40px 20px;color:#9ca3af;font-size:14px}
    /* BADGES */
    .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
    .badge-green{background:#d1fae5;color:#065f46}
    .badge-blue{background:#dbeafe;color:#1e40af}
    .badge-yellow{background:#fef3c7;color:#92400e}
    .badge-red{background:#fee2e2;color:#991b1b}
    .badge-gray{background:#f3f4f6;color:#6b7280}
    .badge-purple{background:#ede9fe;color:#5b21b6}
    /* ALERT ITEMS */
    .alert-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
    .alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px}
    .alert-item.alta{background:#fef2f2;border-left:3px solid #dc2626;color:#991b1b}
    .alert-item.media{background:#fffbeb;border-left:3px solid #d97706;color:#92400e}
    .alert-item.baja{background:#f0fdf4;border-left:3px solid #16a34a;color:#15803d}
    .alert-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
    .alta .alert-dot{background:#dc2626}
    .media .alert-dot{background:#d97706}
    .baja .alert-dot{background:#16a34a}
    /* COMPARISON */
    .comp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #f3f4f6}
    .comp-row:last-child{border-bottom:none}
    .comp-label{font-size:13px;color:#374151;font-weight:500}
    .comp-values{display:flex;align-items:center;gap:16px}
    .comp-cur{font-size:14px;font-weight:700;color:#1a1a2e}
    .comp-prev{font-size:12px;color:#9ca3af}
    .comp-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
    .comp-badge.up{background:#d1fae5;color:#059669}
    .comp-badge.down{background:#fee2e2;color:#dc2626}
    .comp-badge.flat{background:#f3f4f6;color:#6b7280}
    /* LOADING */
    .loading{text-align:center;padding:60px 20px;color:#6b7280}
    .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#0066cc;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* RANKING CARDS */
    .rank-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #f3f4f6}
    .rank-item:last-child{border-bottom:none}
    .rank-num{width:24px;height:24px;border-radius:50%;background:#f3f4f6;color:#6b7280;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .rank-num.top{background:#fef3c7;color:#d97706}
    .rank-name{flex:1;font-size:13px;font-weight:600;color:#1a1a2e}
    .rank-val{font-size:13px;font-weight:700;color:#0066cc}
    /* INCOME TABLE */
    .income-bar-cell{display:flex;align-items:center;gap:8px}
    .income-bar-bg{flex:1;height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden;min-width:60px}
    .income-bar-fill{height:100%;background:#0066cc;border-radius:3px;transition:width .4s}
    /* MARGIN COLOR */
    .margin-good{color:#059669;font-weight:600}
    .margin-warn{color:#d97706;font-weight:600}
    .margin-bad{color:#dc2626;font-weight:600}
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <h1>Nadaki Excursions</h1>
      <span>Dashboard Ejecutivo</span>
    </div>
    <div class="nav-actions">
      <span id="last-updated" style="font-size:12px;color:#9ca3af"></span>
      <button class="btn btn-secondary btn-sm" onclick="loadData()" data-testid="button-refresh">Actualizar</button>
      <a href="/dashboard.html" class="btn btn-secondary btn-sm" data-testid="link-back-dashboard">← Dashboard</a>
    </div>
  </div>
</nav>

<div class="page">

  <!-- FILTERS -->
  <div class="filters-bar" data-testid="filters-bar">
    <div class="filter-group">
      <label>Desde</label>
      <input type="date" id="filter-start" data-testid="input-filter-start">
    </div>
    <div class="filter-group">
      <label>Hasta</label>
      <input type="date" id="filter-end" data-testid="input-filter-end">
    </div>
    <div class="filter-group">
      <label>Barco</label>
      <select id="filter-boat" data-testid="select-filter-boat">
        <option value="">Todos los barcos</option>
      </select>
    </div>
    <div class="date-pills">
      <button class="pill active" onclick="setPreset('month')" data-testid="pill-month">Este mes</button>
      <button class="pill" onclick="setPreset('lastmonth')" data-testid="pill-lastmonth">Mes anterior</button>
      <button class="pill" onclick="setPreset('quarter')" data-testid="pill-quarter">Trimestre</button>
      <button class="pill" onclick="setPreset('year')" data-testid="pill-year">Año</button>
      <button class="pill" onclick="setPreset('week')" data-testid="pill-week">7 días</button>
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary btn-sm" onclick="loadData()" data-testid="button-apply-filters">Aplicar</button>
    </div>
  </div>

  <!-- KPI GRID -->
  <div class="kpi-grid" id="kpi-grid" data-testid="kpi-grid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div><div>Cargando...</div></div>
  </div>

  <!-- RENTABILIDAD POR BARCO -->
  <div class="section-card" data-testid="section-profit-by-boat">
    <div class="section-header">
      <span class="section-title">Rentabilidad por Barco</span>
      <span class="section-meta" id="profit-table-meta"></span>
    </div>
    <div id="profit-table-container"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- ROW: INGRESOS POR DÍA + PRÓXIMOS BOOKINGS -->
  <div class="grid-2">
    <div class="section-card" style="margin-bottom:0" data-testid="section-income-per-day">
      <div class="section-header">
        <span class="section-title">Ingresos por Día</span>
        <span class="section-meta" id="income-day-meta"></span>
      </div>
      <div id="income-day-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card" style="margin-bottom:0" data-testid="section-upcoming">
      <div class="section-header">
        <span class="section-title">Próximos Bookings</span>
        <span class="section-meta" id="upcoming-meta"></span>
      </div>
      <div id="upcoming-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
  <div style="margin-bottom:20px"></div>

  <!-- ROW: GASTOS POR BARCO + CREW COST -->
  <div class="grid-2">
    <div class="section-card" style="margin-bottom:0" data-testid="section-expenses-by-boat">
      <div class="section-header">
        <span class="section-title">Gastos por Barco</span>
      </div>
      <div id="expenses-boat-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card" style="margin-bottom:0" data-testid="section-crew-cost">
      <div class="section-header">
        <span class="section-title">Crew Cost por Barco</span>
      </div>
      <div id="crew-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
  <div style="margin-bottom:20px"></div>

  <!-- ROW: AR + DEPÓSITOS PENDIENTES -->
  <div class="grid-2">
    <div class="section-card" style="margin-bottom:0" data-testid="section-ar">
      <div class="section-header">
        <span class="section-title">Cuentas por Cobrar</span>
        <span class="section-meta" id="ar-meta"></span>
      </div>
      <div id="ar-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card" style="margin-bottom:0" data-testid="section-deposits">
      <div class="section-header">
        <span class="section-title">Depósitos Pendientes</span>
        <span class="section-meta" id="dep-meta"></span>
      </div>
      <div id="dep-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
  <div style="margin-bottom:20px"></div>

  <!-- ROW: ALERTAS + RANKING + COMPARACIÓN -->
  <div class="grid-3">
    <div class="section-card" style="margin-bottom:0" data-testid="section-alerts">
      <div class="section-header">
        <span class="section-title">Alertas Ejecutivas</span>
        <span class="section-meta" id="alerts-meta"></span>
      </div>
      <div id="alerts-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card" style="margin-bottom:0" data-testid="section-ranking">
      <div class="section-header">
        <span class="section-title">Ranking de Barcos</span>
        <span class="section-meta" id="ranking-meta">por ingresos</span>
      </div>
      <div id="ranking-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="section-card" style="margin-bottom:0" data-testid="section-comparison">
      <div class="section-header">
        <span class="section-title">Período vs Anterior</span>
      </div>
      <div id="comparison-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

</div><!-- /page -->

<script src="/executive.js"></script>
</body>
</html>
